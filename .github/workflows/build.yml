name: Build Linux plugin
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libobs-dev libwebsockets-dev libssl-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --verbose
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-streamtranslate-linux
          path: build/obs-streamtranslate.so
