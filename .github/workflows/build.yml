name: Build Linux plugin
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libobs-dev libwebsockets-dev libssl-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --verbose
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-streamtranslate-linux
          path: build/obs-streamtranslate.so

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install libwebsockets pkg-config simde
      - name: Fetch libobs headers
        run: git clone --depth 1 https://github.com/obsproject/obs-studio.git
      - name: Compile plugin bundle
        run: |
          mkdir -p dist/obs-streamtranslate.plugin/Contents/MacOS
          mkdir -p genhdr
          cat > genhdr/obsconfig.h << 'HDR'
          #pragma once
          #define OBS_VERSION "31.0.0"
          #define OBS_VERSION_CANONICAL "31.0.0"
          #define OBS_DATA_PATH "../../data"
          #define OBS_INSTALL_PREFIX ""
          #define OBS_PLUGIN_DESTINATION "obs-plugins"
          #define OBS_RELATIVE_PREFIX "../../"
          #define OBS_RELEASE_CANDIDATE 0
          #define OBS_BETA 0
          HDR
          clang -bundle -O2 -o dist/obs-streamtranslate.plugin/Contents/MacOS/obs-streamtranslate \
            plugin.c \
            -I obs-studio/libobs \
            -I genhdr \
            -I $(brew --prefix)/include \
            $(pkg-config --cflags --libs libwebsockets) \
            -undefined dynamic_lookup
          cat > dist/obs-streamtranslate.plugin/Contents/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>obs-streamtranslate</string>
            <key>CFBundleIdentifier</key><string>live.streamtranslate.obs-plugin</string>
            <key>CFBundleExecutable</key><string>obs-streamtranslate</string>
            <key>CFBundlePackageType</key><string>BNDL</string>
            <key>CFBundleVersion</key><string>0.1.0</string>
          </dict>
          </plist>
          PLIST
      - name: Bundle dylib dependencies (no brew needed on user machines)
        run: |
          BIN=dist/obs-streamtranslate.plugin/Contents/MacOS/obs-streamtranslate
          FW=dist/obs-streamtranslate.plugin/Contents/Frameworks
          mkdir -p "$FW"
          # copy libwebsockets + its openssl deps into the bundle and rewrite load paths
          copy_and_fix() {
            local lib="$1"
            local base=$(basename "$lib")
            [ -f "$FW/$base" ] || cp "$lib" "$FW/$base"
            chmod u+w "$FW/$base"
          }
          LWS=$(otool -L "$BIN" | awk '/libwebsockets/ {print $1}')
          copy_and_fix "$LWS"
          LWS_BASE=$(basename "$LWS")
          install_name_tool -change "$LWS" "@loader_path/../Frameworks/$LWS_BASE" "$BIN"
          # openssl deps referenced by libwebsockets
          for dep in $(otool -L "$FW/$LWS_BASE" | awk '/openssl/ {print $1}'); do
            copy_and_fix "$dep"
            DEP_BASE=$(basename "$dep")
            install_name_tool -change "$dep" "@loader_path/$DEP_BASE" "$FW/$LWS_BASE"
          done
          # libssl itself references libcrypto — fix inside the copied libssl too
          for lib in "$FW"/libssl*.dylib; do
            [ -f "$lib" ] || continue
            for dep in $(otool -L "$lib" | awk '/openssl.*libcrypto/ {print $1}'); do
              copy_and_fix "$dep"
              install_name_tool -change "$dep" "@loader_path/$(basename $dep)" "$lib"
            done
          done
          # ad-hoc sign everything so macOS loads the modified binaries
          codesign --force --sign - "$FW"/*.dylib "$BIN"
          echo "--- final link check ---"
          otool -L "$BIN"
          otool -L "$FW/$LWS_BASE"
      - name: Build .pkg installer
        run: |
          mkdir -p pkgroot out
          cp -R dist/obs-streamtranslate.plugin pkgroot/
          pkgbuild --root pkgroot \
            --identifier live.streamtranslate.obs-plugin \
            --version 0.1.0 \
            --install-location "/Library/Application Support/obs-studio/plugins" \
            out/StreamTranslate-OBS-Plugin.pkg
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-streamtranslate-macos-installer
          path: out/StreamTranslate-OBS-Plugin.pkg
