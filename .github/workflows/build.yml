name: Build Linux plugin
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libobs-dev libwebsockets-dev libssl-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --verbose
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-streamtranslate-linux
          path: build/obs-streamtranslate.so

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install libwebsockets pkg-config simde
      - name: Fetch libobs headers
        run: git clone --depth 1 https://github.com/obsproject/obs-studio.git
      - name: Compile plugin bundle
        run: |
          mkdir -p dist/obs-streamtranslate.plugin/Contents/MacOS
          # obsconfig.h is generated by obs-studio's cmake — stub the handful of defines
          # the public headers actually reference when only compiling a plugin.
          mkdir -p genhdr
          cat > genhdr/obsconfig.h << 'HDR'
          #pragma once
          #define OBS_VERSION "31.0.0"
          #define OBS_VERSION_CANONICAL "31.0.0"
          #define OBS_DATA_PATH "../../data"
          #define OBS_INSTALL_PREFIX ""
          #define OBS_PLUGIN_DESTINATION "obs-plugins"
          #define OBS_RELATIVE_PREFIX "../../"
          #define OBS_RELEASE_CANDIDATE 0
          #define OBS_BETA 0
          HDR
          clang -bundle -O2 -o dist/obs-streamtranslate.plugin/Contents/MacOS/obs-streamtranslate \
            plugin.c \
            -I obs-studio/libobs \
            -I genhdr \
            -I $(brew --prefix)/include \
            $(pkg-config --cflags --libs libwebsockets) \
            -undefined dynamic_lookup
          cat > dist/obs-streamtranslate.plugin/Contents/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>obs-streamtranslate</string>
            <key>CFBundleIdentifier</key><string>live.streamtranslate.obs-plugin</string>
            <key>CFBundleExecutable</key><string>obs-streamtranslate</string>
            <key>CFBundlePackageType</key><string>BNDL</string>
            <key>CFBundleVersion</key><string>0.1.0</string>
          </dict>
          </plist>
          PLIST
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-streamtranslate-macos-arm64
          path: dist/
